version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto-merge
    groups:
      react-ecosystem:
        patterns:
          - "react*"
          - "@tanstack/*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "tailwindcss*"
          - "postcss*"
          - "autoprefixer*"
    ignore:
      # major bumps requerem revisao manual
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - ci
      - auto-merge
